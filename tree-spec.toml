# ════════════════════════════════════════════════════════════════
# TreeSpec — Project Manifest v0.1 (agent-readable)
# Canonical format: documents/concepts/10-manifest.md
#
# This file is **dual-purpose**:
#   1. Declarative configuration for humans and (eventually) tooling.
#   2. Agent-actionable contract — the AI reads it to know which skill
#      runs at each stage, what artifacts to expect, and which rules
#      apply. See `specs/REQ-SETUP-001.md` and the per-skill specs.
#
# Phase: 0 (Solo Dogfood) — only the sections required by the 4-stage flow.
# Other sections ([plugins], [profile], [workspace], [governance),
# [kernel.reproducibility], [pipeline.stewardship]) will be added in
# phase 1+ based on observed pain — see phase_0.md § "TOML v0.1".
#
# Paths in [pipeline.skills.*].file are RELATIVE to this manifest.
# This keeps the kit self-contained and portable — setup.md § Step 4.
# ════════════════════════════════════════════════════════════════

# ── IDENTITY · what is this project ──────────────────────────────
[identity]
name = "treespec-target"                # this repo = a TreeSpec consumer (target)
version = "0.1.0"                       # project semver (not framework)
description = "TreeSpec phase 0 dogfood target: validates the kit by using it as the project itself"
owners = ["treespec-maintainers"]       # who owns this manifest

# ── KERNEL · which kernel version we use ─────────────────────────
[kernel]
version = "0.1.0"                       # semver-range. Phase 0: exact version.
compatibility = "strict"                # strict | lenient. Phase 0 — strict: anything extra is an error.

# ── META · active language (REQ-I18N-001, i18n) ───────────────────
# The kit is localizable: human-readable content (skill procedures,
# reference docs, templates) may be shipped under documents/i18n/<locale>/.
# `language` is required; `default_locale` is optional and defaults to
# `language`. Phase 0 whitelist: exactly "en" and "ru" — any other value
# is accepted by the parser but silently falls back to canonical English.
# Locale resolution is read-only (session-resume § Language); machine
# content (identifiers, commands, oracles, field names) is never localized.
[meta]
language = "en"
default_locale = "en"

# ── PIPELINE · 4 stages instead of 7 (phase 0 fold) ──────────────
# Stages 1–2 (business/system analysis) collapse into "spec",
# stages 4–5 (verification/testing) collapse into "verify".
# See README.md § "Run the 4 stages" for the mapping.
[pipeline]
stage_order = ["spec", "plan", "implement", "verify"]
default_stage = "spec"                  # where the agent starts a new epic

# ── STAGES · per-stage contract (for AI agent) ────────────────────
# Each stage answers: "what is it, which skill to start, which skills
# it may use, what artifacts it produces, how to know it's done, and
# which gate (if any) closes it".

[pipeline.stages.spec]
description = "Define what the system should do: L0 spec + AC with oracles"
entry_skill = "intake"                 # first skill to invoke at this stage
skills = ["intake", "brainstorm", "write-spec"]   # all skills allowed at this stage
produces = ["spec_file", "biz_spec_delta"]
exit_criteria = [
  "Spec file exists at artifacts/global/biz-spec/REQ-DOMAIN-NNN.md",
  "Spec passes L0 validation (id format REQ-[A-Z]{2,6}-\\d{3}, scope.in, AC, oracle)",
  "Spec status = draft (transitions to approved after the gate)",
  "artifacts/INDEX.md has a row referencing the new spec",
  "artifacts/epics/<EPIC>/docs/biz-spec-delta.md created",
]
exit_gate = "G_spec"                    # human approves before stage 2

[pipeline.stages.plan]
description = "Decompose approved spec into atomic tasks + feasibility + (optional) API contracts"
entry_skill = "plan"
skills = ["plan"]
produces = ["tasks_md", "feasibility_md", "system_analysis_md"]
exit_criteria = [
  "tasks.md has T-NN tasks with REQ links",
  "Each task has justified complexity (S/M/L/XL)",
  "Task DAG is cycle-free",
  "Epic complexity = max over tasks (NOT sum)",
  "feasibility.md exists with summary, risks, recommendation",
  "system-analysis.md exists if any task introduces/modifies a public API",
]
exit_gate = "G_plan"

[pipeline.stages.implement]
description = "Implement each task with claim/verify reports; one task per session"
entry_skill = "implement"
skills = ["implement"]
produces = ["code_changes", "report_md"]
exit_criteria = [
  "Every task has docs/report-NN.md with full ac_coverage",
  "Every satisfied AC has test_refs or ci_run (claim/verify mandatory)",
  "scope.out is untouched; any creep is recorded in conflict-NNN.md",
  "STATUS.md and tasks.md updated before declaring done",
]
exit_gate = ""                          # empty = no human gate at this stage

[pipeline.stages.verify]
description = "Run AC oracles mechanically; capture evidence; surface FAILs as conflict docs"
entry_skill = "verify"
skills = ["verify"]
produces = ["verification_md", "evidence_files"]
exit_criteria = [
  "docs/verification.md exists",
  "Every AC has a status: pass | fail | skip | manual_pending",
  "PASS requires observed value = oracle",
  "FAILs trigger docs/conflict-NNN.md (NOT code fixes from verify)",
  "Evidence files exist for ACs with evidence_required=true",
]
exit_gate = "G_done"

# ── SKILLS · per-skill metadata (for AI agent) ───────────────────
# Each skill answers: "where is its procedure, how is it classified,
# what does it produce, what does it expect as input, and what does it
# NOT do (boundary reminder for the agent)".

[pipeline.skills.session-resume]
file = "skills/session-resume/SKILL.md"
classification = "pure"                 # read-only, deterministic
description = "Read-only 'compass' at session start: recover epic state from artifacts, recommend next action"
expects_input = "active epic from artifacts/INDEX.md"
produces = []                          # read-only — no output artifacts
boundary = "MUST NOT invoke any other skill; MUST NOT write to any file"
stage = "any"                          # runs at session start, before any stage

[pipeline.skills.intake]
file = "skills/intake/SKILL.md"
classification = "hybrid"               # deterministic normalization + stochastic extraction judgement
description = "Stage 1 preparation: raw sources → normalized candidates → persistent intake buffer (append-only)"
expects_input = "one or more raw source paths; if none — pass through to brainstorm"
produces = ["intake_buffer_update"]     # rows appended to artifacts/intake/REQUIREMENTS.md
side_artifacts = [
  "artifacts/intake/REQUIREMENTS.md (created on first run if missing)",
]
boundary = "MUST NOT write spec files into biz-spec; MUST NOT select candidates without explicit human confirmation; MUST NOT remove buffer rows"
stage = "spec"

[pipeline.skills.brainstorm]
file = "skills/brainstorm/SKILL.md"
classification = "stochastic"           # dialogue + LLM judgement
description = "Stage 1 dialogue: human idea → L0 spec draft (in memory)"
expects_input = "idea + context from artifacts/INDEX.md and global/biz-spec/"
produces = ["spec_draft"]              # in-memory; handoff to write-spec
boundary = "MUST NOT write to artifacts/global/biz-spec/; MUST NOT fill L2 fields"

[pipeline.skills.write-spec]
file = "skills/write-spec/SKILL.md"
classification = "stochastic"           # validation is mechanical, but generation is LLM
description = "Stage 1 finalize: validate L0 fields, write spec, register in INDEX, create delta"
expects_input = "spec_draft from brainstorm"
produces = ["spec_file", "biz_spec_delta"]
side_artifacts = [
  "artifacts/INDEX.md (updated with the new REQ row)",
  "artifacts/epics/<EPIC>/docs/biz-spec-delta.md (created)",
  "artifacts/epics/<EPIC>/docs/conflict-NNN.md (created if conflicts)",
]
boundary = "MUST validate L0 before writing; MUST NOT fill L2 fields in phase 0"

[pipeline.skills.plan]
file = "skills/plan/SKILL.md"
classification = "hybrid"               # deterministic structure + stochastic estimation
description = "Stage 2: decompose approved spec into tasks + feasibility + (optional) system-analysis"
expects_input = "approved spec (status=approved)"
produces = ["tasks_md", "feasibility_md", "system_analysis_md"]
side_artifacts = [
  "artifacts/epics/<EPIC>/tasks.md",
  "artifacts/epics/<EPIC>/docs/feasibility.md",
  "artifacts/epics/<EPIC>/docs/system-analysis.md (only if API)",
]
boundary = "MUST refuse on cycle; MUST NOT sum complexity; MUST NOT modify the spec"

[pipeline.skills.implement]
file = "skills/implement/SKILL.md"
classification = "hybrid"
description = "Stage 3: implement one task per session, write claim/verify report"
expects_input = "task T-NN from tasks.md, related spec"
produces = ["code_changes", "report_md"]
side_artifacts = [
  "artifacts/epics/<EPIC>/docs/report-NN.md (one per task)",
  "artifacts/epics/<EPIC>/STATUS.md (updated)",
  "artifacts/epics/<EPIC>/tasks.md (status updated)",
  "artifacts/epics/<EPIC>/docs/conflict-NNN.md (if scope creep / breaking change)",
]
boundary = "MUST run one task per session; MUST NOT claim pass without evidence; MUST NOT widen scope"

[pipeline.skills.verify]
file = "skills/verify/SKILL.md"
classification = "pure"                 # deterministic oracle execution
description = "Stage 4: run AC oracles, capture evidence, surface FAILs as conflict docs"
expects_input = "approved spec + report(s) from implement"
produces = ["verification_md", "evidence_files"]
side_artifacts = [
  "artifacts/epics/<EPIC>/docs/verification.md",
  "artifacts/epics/<EPIC>/docs/evidence/REQ-...AC-N.<format> (per AC)",
]
boundary = "MUST NOT edit code; MUST NOT claim PASS for SKIP / MANUAL_PENDING without justification"

# ── EVALUATION · global rules that apply across all stages ───────
# These are the cross-cutting invariants. Each maps to a kernel invariant
# (CON-07) but is repeated here so the agent sees them in the manifest
# it reads — not only in the conceptual docs.

[pipeline.evaluation]
claim_verify = "mandatory — every report has claim + verify parts (kernel invariant 3)"
scope_respect = "scope.in only; scope.out is taboo; any creep → conflict doc"
conflict_handling = "open conflict docs block stage progression (kernel invariant 2)"
history_append_only = "PATH.md and DECISIONS.md are append-only (kernel invariant 1)"
skill_composition = "explicit only — composition in skill frontmatter must be declared (kernel invariant 6)"
backward_compatibility = "adding optional sections/plugins must not invalidate existing artifacts (kernel invariant 4)"
unknown_fields = "unknown fields do not break the kernel — they are ignored or marked disabled (kernel invariant 5)"
human_gates = "G_spec, G_plan, G_done — only humans may pass these (principle 6: human decides)"
evidence_required = "any AC with verification.evidence_required=true MUST save its evidence file"

# ── GATES · three human gates (CON-09, human-only in phase 0) ─────
# Automated gates (CON-09 automated-only / hybrid) come in phase 2+,
# after the skill execution runtime appears.

[pipeline.gates.G_spec]
description = "Spec approved by human: all L0 fields filled, AC with oracles, no blocking open_questions"
participants = [{ kind = "human", id = "owner" }]

[pipeline.gates.G_plan]
description = "Plan approved by human: tasks agreed, complexity adjusted"
participants = [{ kind = "human", id = "owner" }]

[pipeline.gates.G_done]
description = "Verification accepted by human: oracles passed mechanically, evidence captured"
participants = [
  { kind = "skill", id = "verify" },    # skill prepares evidence
  { kind = "human", id = "owner" },     # human makes the decision
]

# ── GOVERNANCE · deferred to phase 2+ ────────────────────────────
# Will appear once the pain arrives: gate timeouts, escalation policy,
# who may edit the manifest, audit level. For now — kernel defaults:
# all gates are strict (fail-closed), decisions are owned.

# ── INVARIANTS · quick reference for the reviewer ────────────────
# This manifest obeys the 6 kernel invariants (documents/concepts/07-kernel.md):
# 1. PATH/DECISIONS are append-only — enforced by the protocol, not the manifest.
# 2. Conflict doc blocks — enforced by the protocol; restated in [pipeline.evaluation].
# 3. Claim/verify is mandatory — enforced by report.template.md; restated above.
# 4. Backward compatibility on growth — phase 0 does not exercise this yet.
# 5. Unknown fields do not break the kernel — phase 0 is strict, so adding
#    fields in phase 1+ will require a migration.
# 6. Skill composition is explicit — every skill declares its composition in
#    frontmatter; `session-resume` is a special case (read-only, never invokes).